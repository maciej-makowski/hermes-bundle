# Component manifest read by scripts/*.sh. Not a Hermes format.
version: 1
repo: maciej-makowski/hermes-bundle
components:
  - id: design-doc-edit
    type: plugin
    path: plugins/design-doc-edit
    enable: true
  - id: holographic
    type: catalog-plugin
    enable: true
  - id: unslop
    type: skill
    path: skills/unslop
  - id: hermes-desktop-plugins
    type: skill
    path: skills/hermes-desktop-plugins
  - id: hermes-themes
    type: skill
    path: skills/hermes-themes
  - id: hermes-session-storage
    type: skill
    path: skills/hermes-session-storage
  - id: nvme-drive-qualification
    type: skill
    path: skills/nvme-drive-qualification
